# Mapa de cuentas bancarias. Es configuración, no algo que el contable adivine.
#
# El colector OpenBanking piensa en logins de banco; QualiaConta piensa en
# empresas. Este archivo traduce entre los dos y dice en qué cuenta contable de
# ADM Cloud cae cada cuenta bancaria.
#
# REGLA DURA: si una cuenta no figura acá bajo una empresa, el contable de esa
# empresa NO la mira ni la suma. Mezclar cuentas entre empresas es el error más
# grave que se puede cometer con estos datos, y es silencioso.
#
# Copiar a mapa-cuentas.yaml y llenar.

empresas:
  blackbox:
    # Blackbox banca en Banco Santa Cruz. El colector tiene el driver
    # (`santacruz-empresarial`, ya registrado) pero todavía no está configurado
    # el login, así que no hay movimientos que leer.
    #
    # Hasta que el colector recoja esa cuenta, esta lista queda VACÍA a
    # propósito: el contable de Blackbox no tiene ninguna cuenta que mirar.
    cuentas: []

    # Cuando el colector empiece a recogerla, se agrega así:
    # cuentas:
    #   - banco: santacruz
    #     numero: ""
    #     moneda: DOP
    #     cuenta_contable: ""        # código de la cuenta en ADM Cloud
    #     alias: ""

