# Compose de referencia para UNA empresa.
#
# Agregar una empresa = copiar esta carpeta, cambiar el .env y levantar.
# Quitarla = borrar la carpeta. Ninguna operación toca a las demás.
#
# La imagen se construye una sola vez desde la fuente de Hermes y la comparten
# todas las empresas:
#   cd /home/codebox/qualiaconta/hermes-agent && docker build -t hermes-agent:local .
#
# Fijado en Hermes v0.19.0, commit 14abd64.

services:
  contable:
    # Imagen propia: Hermes + cliente de Postgres (ver deploy/Dockerfile).
    image: qualiaconta:local
    container_name: qualiaconta-${EMPRESA}
    restart: unless-stopped
    env_file: .env

    # Sin esto el contenedor arranca `hermes` a secas — el agente interactivo —
    # y nunca se conecta a Telegram. `gateway` es el proceso que atiende los
    # mensajes.
    command: gateway

    # Red del host, como trae Hermes de fábrica. Lo intenté aislado y no
    # funciona: Supabase resuelve sólo a IPv6 y la red puente de Docker no lo
    # enruta, así que el contable no podía llegar al banco. El puerto del panel
    # se resuelve con una variable por empresa; el IPv6 no se resuelve de otra
    # forma sin tocar el demonio de Docker, que pide sudo.
    #
    # El panel sigue escuchando sólo en 127.0.0.1, así que no queda expuesto en
    # la LAN. Para entrar: túnel ssh contra el puerto de esa empresa.
    network_mode: host

    volumes:
      # Estado del contable: memoria, skills, libro de acción.
      # Es la carpeta del repo, así el libro de acción queda en git solo.
      - ./hermes:/opt/data
      # Núcleo DGII compartido, SÓLO LECTURA. Ninguna empresa escribe en él.
      - ../../nucleo-dgii:/nucleo-dgii:ro
      # Skills del contable, compartidas por todas las empresas. Van en una
      # subcarpeta para no pisar las 70 que Hermes trae de fábrica.
      - ../../skills:/opt/data/skills/qualiaconta:ro
      # Mapa de cuentas bancarias, sólo lectura.
      - ../../mapa-cuentas.yaml:/mapa-cuentas.yaml:ro

    environment:
      # Dueño de los archivos que cree el contenedor: el usuario del host,
      # para que el libro de acción quede legible y commiteable desde afuera.
      HERMES_UID: "1000"
      HERMES_GID: "1000"
      # Puerto del panel, distinto por empresa para que no choquen.
      API_SERVER_PORT: ${PUERTO_PANEL:-8642}

    # Sin puertos publicados: con red del host no hacen falta. Sale hacia
    # Telegram, ADM Cloud, el banco y el modelo. El panel escucha en
    # 127.0.0.1:${PUERTO_PANEL}, alcanzable sólo con túnel ssh:
    #   ssh -L 8642:localhost:8642 codebox
