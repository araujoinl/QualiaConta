# Compose de Blackbox. Copiado de deploy/compose.example.yaml.
#
# Agregar una empresa = copiar esta carpeta, cambiar el .env y levantar.
# Quitarla = borrar la carpeta. Ninguna operación toca a las demás.
#
# La imagen se construye una sola vez desde la fuente de Hermes y la comparten
# todas las empresas:
#   cd /home/codebox/qualiaconta/hermes-agent && docker build -t hermes-agent:local .
#
# Fijado en Hermes v0.19.0, commit 14abd64.

services:
  # ─────────────────────────────────────────────────────────────────────────
  # RETIRADO el 2026-08-17: el gateway de Hermes se apagó y se eliminó.
  #
  # Su trabajo vive en la nube desde ese día: los 5 detectores en
  # qualia-sugerencias, el análisis en qualia-preparador + qualia-proponedor, y
  # los casos difíciles en qualia-contable. El interruptor está en
  # qualia_config (`modo:<funcion>`); volver todo a 'server' NO revive esto —
  # el contenedor ya no existe.
  #
  # Queda comentado y no borrado a propósito: es la receta exacta de cómo
  # corría, y el kit para revivirlo (imagen + volumen + config + crons) está
  # fuera del server, en ~/Rescate-Hermes-2026-08-17 de la máquina de Carlos.
  #
  # El servicio `mesa` de abajo SIGUE VIVO: es el que registra en ADM lo que el
  # humano aprueba. Ese es el próximo tramo (F4).
  # ─────────────────────────────────────────────────────────────────────────
#   contable:
#     # Imagen propia: Hermes + cliente de Postgres (ver deploy/Dockerfile).
#     image: qualiaconta:local
#     container_name: qualiaconta-${EMPRESA}
#     restart: unless-stopped
#     env_file: .env
#
#     # Sin esto el contenedor arranca `hermes` a secas — el agente interactivo —
#     # y nunca se conecta a Telegram. `gateway` es el proceso que atiende los
#     # mensajes.
#     command: gateway
#
#     # Red del host, como trae Hermes de fábrica. Lo intenté aislado y no
#     # funciona: Supabase resuelve sólo a IPv6 y la red puente de Docker no lo
#     # enruta, así que el contable no podía llegar al banco. El puerto del panel
#     # se resuelve con una variable por empresa; el IPv6 no se resuelve de otra
#     # forma sin tocar el demonio de Docker, que pide sudo.
#     #
#     # El panel sigue escuchando sólo en 127.0.0.1, así que no queda expuesto en
#     # la LAN. Para entrar: túnel ssh contra el puerto de esa empresa.
#     network_mode: host
#
#     volumes:
#       # Estado del contable: memoria, skills, libro de acción.
#       # Es la carpeta del repo, así el libro de acción queda en git solo.
#       - ./hermes:/opt/data
#       # Núcleo DGII compartido, SÓLO LECTURA. Ninguna empresa escribe en él.
#       - ../../nucleo-contable:/nucleo-contable:ro
#       # Skills del contable, compartidas por todas las empresas. Van en una
#       # subcarpeta para no pisar las 70 que Hermes trae de fábrica.
#       - ../../skills:/opt/data/skills/qualiaconta:ro
#       # Mapa de cuentas bancarias, sólo lectura.
#       - ../../mapa-cuentas.yaml:/mapa-cuentas.yaml:ro
#       # Workdir compartido con el sidecar 'mesa': el preparador deja ahí el
#       # documento bajado y el dossier, y el contable los encuentra en su ruta
#       # de siempre (/tmp/mesa/<id>/...) sin re-descargar nada.
#       - ./mesa-cache:/tmp/mesa
#
#     environment:
#       # Dueño de los archivos que cree el contenedor: el usuario del host,
#       # para que el libro de acción quede legible y commiteable desde afuera.
#       HERMES_UID: "1000"
#       HERMES_GID: "1000"
#       # Puerto del panel, distinto por empresa para que no choquen.
#       API_SERVER_PORT: ${PUERTO_PANEL:-8642}
#
#     # Sin puertos publicados: sale hacia Telegram, ADM Cloud y el modelo.
#     # Nadie entra. No necesita proxy ni túnel.
#     #
#     # Para entrar al panel de Hermes cuando haga falta, túnel por ssh:
#     #   ssh -L 8642:localhost:8642 codebox
#     # y publicar el puerto sólo en loopback en esta empresa:
#     #   ports: ["127.0.0.1:8642:8642"]
#
#   # Poller de la mesa de trabajo: vigila la cola qualia_* en la Supabase de
#   # Labs_Inv y despierta al contable por el webhook local cuando hay trabajo.
#   # Sin LLM: solo psql + curl (misma imagen, ya los trae). Red de host para
#   # alcanzar el panel del gateway en 127.0.0.1 y el IPv6 de Supabase.
#   # Contrato completo: docs/mesa-de-trabajo.md

  mesa:
    image: qualiaconta:local
    container_name: qualiaconta-mesa-${EMPRESA}
    restart: unless-stopped
    env_file: .env
    network_mode: host
    entrypoint: ["/bin/bash", "/mesa/poller.sh"]
    environment:
      # Puerto de platforms.webhook del gateway (config.yaml); si la empresa lo
      # cambia alla, fijarlo tambien aca en el .env.
      WEBHOOK_PORT: ${WEBHOOK_PORT:-8644}
      # Tick corto: la subida en la web dispara al contable en ~4s (la consulta
      # es indexada y trivial; la latencia dominante es el analisis del modelo).
      MESA_INTERVALO: ${MESA_INTERVALO:-4}
    # Latido: el poller escribe epoch en /tmp/latido en cada tick; si envejece
    # más de 2 minutos, el loop está congelado (aunque el proceso viva) y
    # Docker lo reinicia. Complemento del monitoreo, no su reemplazo.
    healthcheck:
      test: ["CMD-SHELL", "test $$(( $$(date +%s) - $$(cat /tmp/latido 2>/dev/null || echo 0) )) -lt 120"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s
    volumes:
      - ../../mesa:/mesa:ro
      # Workdir compartido con el contable (mismo mount de arriba): acá escribe
      # preparar-trabajo.sh, con chown a HERMES_UID para que el contable lea.
      - ./mesa-cache:/tmp/mesa
      # Scripts de la memoria del contable (consultar-ncf-dgii.py, etc.),
      # sólo lectura: el preparador los reusa en vez de duplicarlos.
      - ./hermes/memoria/scripts:/memoria-scripts:ro
      # Memoria curada completa, sólo lectura: el proponedor determinista lee
      # el bloque del proveedor en proveedores.md (el tratamiento típico
      # matiza al agg, y su marca AMBIGUO es compuerta dura).
      - ./hermes/memoria:/memoria:ro
      # Libreta general del 606 (rnc-tipo-gasto.json), sólo lectura: el tipo
      # de gasto del proponedor sale de ahí, como en buscar-precedente.py.
      - ../../nucleo-contable:/nucleo-contable:ro
      # Libro de acción, ESCRITURA: escribir-libro.py deja acá la entrada por
      # plantilla tras el registro directo (chown a HERMES_UID, como el prep,
      # para que quede commiteable desde afuera).
      - ./hermes/libro-de-accion:/libro
      # Histórico de VendorBills para el chequeo de duplicados por grep,
      # sólo lectura. Si el mount no existe, el prep lo salta con motivo.
      - ./hermes/preentrenamiento:/preentrenamiento:ro
      # Comprobantes fiscales del banco, uno por NCF, que se adjuntan al cargo
      # en ADM. Los deja partir-comprobantes.py (del repo del colector) desde el
      # PDF que el banco exporta por período. Se montan del disco y no se bajan
      # de Storage a propósito: así este contenedor no necesita la service_role
      # de Supabase para adjuntar un papel.
      - /home/codebox/comprobantes-pdf/pdfs:/comprobantes:ro
